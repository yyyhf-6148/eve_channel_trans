name: Build & Release

# 触发方式：
#   1) 推送版本标签：git tag v1.3.0 && git push origin v1.3.0
#   2) 或手动在 Actions 页面点 Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller onefile)
        run: pyinstaller --noconfirm --clean build.spec

      - name: Rename exe with version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Move-Item "dist\EVE频道翻译.exe" "dist\EVE频道翻译-$tag.exe" -Force

      - name: Upload artifact (debug/manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: EVE频道翻译-exe
          path: dist/EVE频道翻译*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EVE频道翻译-${{ github.ref_name }}.exe
          generate_release_notes: true