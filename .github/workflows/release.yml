name: Build & Release

# 每次推送到 main 自动打包 exe 并创建 GitHub Release；
# 也可手动在 Actions 页面点 Run workflow。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller onefile)
        run: pyinstaller --noconfirm --clean build.spec

      - name: Rename exe with commit
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          Move-Item "dist\EVE频道翻译.exe" "dist\EVE频道翻译-$short.exe" -Force
          "short=$short" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVE频道翻译-exe
          path: dist/EVE频道翻译*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ env.short }}
          name: Auto build ${{ env.short }}
          body: |
            自动构建（commit `${{ github.sha }}`）
          files: dist/EVE频道翻译-${{ env.short }}.exe